<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tạo form và các điều khiển</title>
</head>
<body>
  <form id="frmDK">
    <table border="1" bgcolor="#CCFFCC">
      <tr>
        <td colspan="2" align="center"><b>Phiếu đăng ký tham gia chương trình khuyến mãi</b></td>
      </tr>
      <tr>
        <td>Họ và tên</td>
        <td><input type="text" id="txtHoten" size="30" value="Nguyễn Ngọc Quỳnh Nga"></td>
      </tr>
      <tr>
        <td>Địa chỉ</td>
        <td><input type="text" id="txtDiachi" size="30" value="2B/a Hùng Vương, Q10"></td>
      </tr>
      <tr>
        <td>Điện thoại</td>
        <td><input type="text" id="txtDienthoai" size="20" value="0909097506"></td>
      </tr>
      <tr>
        <td>Phái</td>
        <td>
          <input type="radio" name="phai" id="rdNam" value="Nam"> Nam
          <input type="radio" name="phai" id="rdNu" value="Nữ" checked> Nữ
        </td>
      </tr>
      <tr>
        <td>Nghề nghiệp</td>
        <td>
          <select id="cboNghe">
            <option value="Bác sĩ">Bác sĩ</option>
            <option value="Kỹ sư">Kỹ sư</option>
            <option value="Giáo viên" selected>Giáo viên</option>
            <option value="Khác">Khác</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Chọn sản phẩm tham gia</td>
        <td>
          <select id="lstSP" size="4" multiple>
            <option value="Kem đánh răng" selected>Kem đánh răng</option>
            <option value="Bột giặt">Bột giặt</option>
            <option value="Dầu gội đầu" selected>Dầu gội đầu</option>
            <option value="Sữa tắm">Sữa tắm</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Số người dự đoán tham gia</td>
        <td><input type="text" id="txtSonguoi" size="10" value="250000"></td>
      </tr>
      <tr>
        <td colspan="2" align="center">
          <input type="button" id="btnOK" value="Đồng ý" onclick="document.getElementById('lblTB').innerText='Bạn đã đăng ký thành công!!!';">
        </td>
      </tr>
      <tr>
        <td colspan="2" align="center"><div id="lblTB" style="color:red;"></div></td>
      </tr>
    </table>
  </form>
</body>
</html>
